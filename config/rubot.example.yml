# Rubot Configuration
# Copy this file to ~/.rubot/config.yml and edit it.

agents:
  defaults:
    workspace: ~/.rubot/workspace
    name: gpt-4o-mini
    model: openai/gpt-4o-mini
    api_key: sk-your-key
    api_base: https://api.openai.com/v1
    # Preset used by new sessions. Remove it to use the implicit `default`
    # preset built from the direct model fields above.
    model_preset: primary
    max_tokens: 4096
    temperature: 0.3
    # Model for the requests that are not the conversation: naming a session
    # and extracting memory. They ask for a title or a JSON object, so a fast
    # cheap model is the right one; leaving it unset uses the conversation's
    # own model, as every build did before. Accepts a `model_presets` name or
    # a model id the provider knows. Example:
    #   auxiliary_model: deepseek-v4.1-flash
    # auxiliary_model:
    system_prompt: "You are Rubot, a helpful AI assistant running in the terminal.\nBe concise and helpful."
    # Maximum agent rounds per user message. One round can run several
    # tools; re-asks and continuations also count. A multi-file coding task
    # routinely needs more than 50. Default 120.
    max_rounds: 120
    # Context compaction. When the conversation reaches `threshold_percent` of
    # the model's context window, older turns are summarized into the running
    # summary and the most recent `keep_recent_messages` are kept verbatim.
    # Use `/compact` to trigger it manually at any time. A turn that is still
    # running is never summarized away, and the summary is written to a length
    # that follows the amount of conversation it replaces.
    compaction:
      auto: true
      threshold_percent: 60   # 0.6 is also accepted
      keep_recent_messages: 40
      # Token-based alternative: keep this many tokens of the newest transcript.
      # keep_recent_tokens: 20000
      # Optional absolute ceiling, in estimated tokens. Useful with a large
      # context window (e.g. 1M tokens), where a percentage alone is
      # unreachable in practice. 0 disables it; the lower of this and
      # threshold_percent wins.
      threshold_tokens: 120_000
    # What is sent to the provider from the transcript. Reasoning from past
    # turns is never re-sent; only the turn being executed keeps it.
    history:
      # 0 means no message-count cap: the context window and compaction bound
      # the request. A small cap silently drops the beginning of a long task
      # while the model's window still has room.
      limit: 0
      # Optional token budget for the history block; 0 means no cap. If you
      # set this, keep it above `compaction.threshold_tokens` so compaction
      # summarizes before the request starts losing messages.
      max_tokens: 0
    # Safety guard — restrict agent access to the workspace directory.
    # When true, file operations and command execution are confined to `workspace`.
    # Set to false to disable sandboxing (not recommended).
    restrict_to_workspace: true
    # When restrict_to_workspace is true, allow read-only access outside the workspace.
    # Write operations are always blocked outside the workspace.
    allow_read_outside_workspace: false
    # Auto mode — skip the confirmation prompt and run anything the safety
    # guard allows. The destructive patterns in the guard (rm -rf /, mkfs,
    # dd onto a device, ...) are still refused, so this removes a question,
    # not a limit. Toggled from the chat with /auto on|off.
    auto_approve: false

# Editor opened by Ctrl+G in the TUI to write the prompt in. Falls back to
# $VISUAL, then $EDITOR, then `vi` when unset. The command must block until
# the file is saved (`code --wait`, not `code`).
# external_editor: nvim

model_presets:
  # Named, complete model configurations. `/model <name>` switches the current
  # session; `/preset set|default|delete` manages these from Telegram.
  # `model` may be a `models` entry name or a provider model id.
  primary:
    model: gpt-4o-mini
    max_tokens: 4096
    temperature: 0.3
    # Optional OpenAI-style reasoning hint (minimal/low/medium/high), sent as
    # `reasoning_effort`. Models that do not support it ignore the field.
    # reasoning_effort: low
    # Context window and prices used by /usage (USD per 1M tokens).
    # By default these come from models.dev and are cached in
    # model_pricing.json next to config.yml (one file for every persona).
    # Set them only to override.
    context_window_tokens: 128000
    # pricing:
    #   input_per_mtok: 0.15
    #   cached_input_per_mtok: 0.075
    #   output_per_mtok: 0.60
  # fast:
  #   model: deepseek-v4.1-flash
  #   temperature: 0.2
  # local:
  #   model: llama3
  #   provider: ollama
  #   api_base: http://localhost:11434

tools:
  shell_exec:
    enabled: true          # Execute shell commands
  file_ops:
    enabled: true          # Read/edit/write/list files
  search:
    enabled: true          # Find files and matching lines (grep/glob)
  web_fetch:
    enabled: true          # Search and fetch web content
  cron:
    enabled: true          # Schedule recurring and one-time jobs
  send_files:
    enabled: true          # Send generated files/images back to the chat
  delegate:
    enabled: true          # Let an agent hand a task to another persona
  # memory is always enabled when workspace exists

# Sub-agent delegation. Off by default: enabling it costs extra provider
# requests. A sub agent runs in the same session actor, uses the target
# persona's model/prompt/memory/workspace, and cannot delegate further.
# delegation:
#   enabled: false
#   max_per_turn: 4
#   max_depth: 1

# Channels — how users interact with Rubot.
# Multiple channels can run simultaneously.
#
# Available channels:
#   tui      — Terminal UI chat (full-screen, ruby-tui). `repl` is a legacy alias.
#   telegram — Telegram Bot (long polling or webhook)
#   web      — Browser UI (HTMX + Server-Sent Events). `rubot web` runs it alone.

channels:

  repl:
    enabled: true
    stream: true

  # Browser chat. Ruby renders every HTML fragment; the page only wires the
  # composer. Bind to loopback unless you put a token in front of it: this
  # channel can run shell commands.
  # web:
  #   enabled: true
  #   host: 127.0.0.1        # anything else needs `token`
  #   port: 4567
  #   persona: rubot         # session id becomes web_<persona>
  #   token: ""              # shared secret, checked on every request
  #   access_log: false      # true prints one line per request
  #   # Web Push. The key pair is generated on first use in vapid.json beside
  #   # this file (mode 0600) and never leaves the machine; deleting it silently
  #   # invalidates every subscription, so the device has to be re-subscribed.
  #   # `sub` is the contact the push service may complain to; any mailto works.
  #   vapid_subject: mailto:rubot@localhost
  #   # Seconds a turn must run before its ending is worth a notification.
  #   # A reply that takes a moment is answered while the reader is still
  #   # looking; one that takes a minute is the kind of thing people walk away
  #   # from. 0 turns the notifications off.
  #   turn_notify_after: 20

  telegram:
    enabled: true
    token: "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"  # or set TELEGRAM_BOT_TOKEN env var
    # allowed_user_ids: [123456789]   # optional: restrict to specific Telegram user IDs
    # allowed_chat_ids: [123456789]   # optional: restrict to specific chat IDs
    stream: false                    # streaming is not supported for Telegram yet
    typing_indicator: true           # show "typing..." while processing
    narration: true                  # send the model's progress narration as chat messages
    tool_notifications: true         # show/edit a status line while tools run
    max_message_length: 4096         # Telegram max message length
    # Forum topics (groups with Topics enabled) get a per-topic persona:
    # model + system prompt, stored in <workspace>/personas.json and managed
    # with the /persona wizard. The bot must be a group admin (or privacy mode
    # off) to receive forum_topic_created. General uses the default persona.

    # Webhook mode (alternative to long polling):
    # webhook: true
    # webhook_url: "https://your-domain.com/webhook"
    # webhook_port: 8443

# Safety Guard
#
# The safety guard mechanism protects your system by restricting what the
# agent can do. It has two layers:
#
#   1. Workspace restriction — confines file operations (read, write, append,
#      list, info) and command execution to the `workspace` directory.
#   2. Dangerous command blocking — always blocks harmful patterns regardless
#      of workspace mode (e.g. `rm -rf /`, `mkfs`, `curl | sh`, etc.).
#
# The web tool also blocks requests to private/internal IPs (SSRF protection).
#
# Safe paths like /dev/null, /dev/urandom, /dev/stdin, etc. are always
# accessible even in restricted mode.
#
# Workspace files (placed in ~/.rubot/workspace/):
#
# SOUL.md — The bot's personality and identity.
#   A freeform Markdown file describing who the bot is,
#   its values, communication style, and character.
#
# AGENTS.md — Agent configuration with YAML frontmatter + behavior rules.
#   Frontmatter can override: name, model, max_tokens, temperature,
#   max_rounds, and tool enable/disable settings.
#   The body contains behavior rules injected into the system prompt.
#
# MEMORY.md — Persistent memory managed by the bot itself.
#   The bot reads this on every session and can update it via the
#   memory tool to remember facts, preferences, and context. The file next
#   to config.yml is the global layer; a persona keeps its own inside
#   personas/<slug>/MEMORY.md, and a project's lives in memory/<slug>.md.
#
# personas.json — Personas: a web specialist (keyed by slug, with a directory
#   under personas/<slug>/) or a Telegram forum topic (keyed by
#   "<chat_id>:<thread_id>"). A topic points at an existing persona with
#   "ref" so it shares that persona's memory but keeps its own session.
#   Managed by /persona and the web UI; plain JSON, editable by hand.
#   Example:
#     {
#       "-1001234567890:42": { "ref": "personal-trainer" },
#       "-1001234567890:43": {
#         "name": "trading",
#         "model": "gpt-4o-mini",
#         "system_prompt": "Kamu adalah asisten trading.",
#         "skills": ["writing"],
#         "created_at": "2026-02-11T10:00:00Z"
#       }
#     }
#   If a persona model is removed from config.yml, the topic falls back to
#   the default model with a warning.
#
# model_catalog.json — Cache of the provider's GET /models response, next to
#   config.yml and shared by every persona. Deleting it is safe; the next
#   /models or /persona command refreshes it.
#
# model_pricing.json — Cache of models.dev pricing/context data used by /usage.
#   Refreshed every 24 hours. Delete it to force a refresh; if the API is
#   unreachable the stale cache (or the bundled defaults) is used instead.
#
# Skills — specialized instruction sets loaded on demand.
#   Stored in: ~/.rubot/workspace/skills/{skill-name}/SKILL.md
#   Each skill has a SKILL.md with YAML frontmatter (name, description)
#   and markdown body (specialized instructions).
#   Skills appear in the system prompt as <available_skills> XML,
#   telling the bot when and how to use them.
#   Run "rubot init" to get the built-in "skill-creator" skill.
#
# Cron — scheduled jobs are stored in:
#   ~/.rubot/workspace/cron/jobs.json     (job definitions)
#   ~/.rubot/workspace/cron_pending/       (pending agent-turn messages)
#
# To disable the cron tool, set tools.cron.enabled: false above.
# Jobs are processed automatically on your next interaction with the bot.
#
# Run "rubot init" to create the workspace with default files.
