# Rubot Configuration
# Copy this file to ~/.rubot/config.yml and edit it.

agents:
  defaults:
    workspace: ~/.rubot/workspace
    name: gpt-4o-mini
    max_tokens: 4096
    temperature: 0.7
    system_prompt: "You are Rubot, a helpful AI assistant running in the terminal.\nBe concise and helpful."
    max_tool_iterations: 50

models:
  - name: gpt-4o-mini
    model: openai/gpt-4o-mini
    api_key: sk-your-key
    api_base: https://api.openai.com/v1
  - name: llama3
    model: ollama/llama3
    api_base: http://localhost:11434

tools:
  exec:
    enabled: true
  read_file:
    enabled: true
  write_file:
    enabled: true
  list_dir:
    enabled: true
  web_fetch:
    enabled: true
  # memory is always enabled when workspace exists

# Channels — how users interact with Rubot.
# Multiple channels can run simultaneously.
#
# Available channels:
#   repl     — Terminal REPL (default if no channels configured)
#   telegram — Telegram Bot (long polling or webhook)

channels:

  repl:
    enabled: true
    stream: true

  telegram:
    enabled: true
    token: "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"  # or set TELEGRAM_BOT_TOKEN env var
    # allowed_user_ids: [123456789]   # optional: restrict to specific Telegram user IDs
    # allowed_chat_ids: [123456789]   # optional: restrict to specific chat IDs
    stream: false                    # streaming is not supported for Telegram yet
    typing_indicator: true           # show "typing..." while processing
    max_message_length: 4096         # Telegram max message length

    # Webhook mode (alternative to long polling):
    # webhook: true
    # webhook_url: "https://your-domain.com/webhook"
    # webhook_port: 8443

# Workspace files (placed in ~/.rubot/workspace/):
#
# SOUL.md — The bot's personality and identity.
#   A freeform Markdown file describing who the bot is,
#   its values, communication style, and character.
#
# AGENTS.md — Agent configuration with YAML frontmatter + behavior rules.
#   Frontmatter can override: name, model, max_tokens, temperature,
#   max_tool_iterations, and tool enable/disable settings.
#   The body contains behavior rules injected into the system prompt.
#
# MEMORY.md — Persistent memory managed by the bot itself.
#   The bot reads this on every session and can update it via the
#   memory tool to remember facts, preferences, and context.
#
# Run "rubot init" to create the workspace with default files.
