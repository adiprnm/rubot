# Rubot Configuration
# Copy this file to ~/.rubot/config.yml and edit it.

agents:
  defaults:
    workspace: ~/.rubot/workspace
    name: gpt-4o-mini
    max_tokens: 4096
    temperature: 0.7
    system_prompt: "You are Rubot, a helpful AI assistant running in the terminal.\nBe concise and helpful."
    max_tool_iterations: 50
    # Safety guard — restrict agent access to the workspace directory.
    # When true, file operations and command execution are confined to `workspace`.
    # Set to false to disable sandboxing (not recommended).
    restrict_to_workspace: true
    # When restrict_to_workspace is true, allow read-only access outside the workspace.
    # Write operations are always blocked outside the workspace.
    allow_read_outside_workspace: false

models:
  - name: gpt-4o-mini
    model: openai/gpt-4o-mini
    api_key: sk-your-key
    api_base: https://api.openai.com/v1
  - name: llama3
    model: ollama/llama3
    api_base: http://localhost:11434

tools:
  shell_exec:
    enabled: true          # Execute shell commands
  file_ops:
    enabled: true          # Read/write/list files
  web_fetch:
    enabled: true          # Search and fetch web content
  cron:
    enabled: true          # Schedule recurring and one-time jobs
  send_file:
    enabled: true          # Send generated files/images back to the chat
  # memory is always enabled when workspace exists

# Channels — how users interact with Rubot.
# Multiple channels can run simultaneously.
#
# Available channels:
#   repl     — Terminal REPL (default if no channels configured)
#   telegram — Telegram Bot (long polling or webhook)

channels:

  repl:
    enabled: true
    stream: true

  telegram:
    enabled: true
    token: "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"  # or set TELEGRAM_BOT_TOKEN env var
    # allowed_user_ids: [123456789]   # optional: restrict to specific Telegram user IDs
    # allowed_chat_ids: [123456789]   # optional: restrict to specific chat IDs
    stream: false                    # streaming is not supported for Telegram yet
    typing_indicator: true           # show "typing..." while processing
    narration: true                  # send the model's progress narration as chat messages
    tool_notifications: true         # show/edit a status line while tools run
    max_message_length: 4096         # Telegram max message length

    # Webhook mode (alternative to long polling):
    # webhook: true
    # webhook_url: "https://your-domain.com/webhook"
    # webhook_port: 8443

# Safety Guard
#
# The safety guard mechanism protects your system by restricting what the
# agent can do. It has two layers:
#
#   1. Workspace restriction — confines file operations (read, write, append,
#      list, info) and command execution to the `workspace` directory.
#   2. Dangerous command blocking — always blocks harmful patterns regardless
#      of workspace mode (e.g. `rm -rf /`, `mkfs`, `curl | sh`, etc.).
#
# The web tool also blocks requests to private/internal IPs (SSRF protection).
#
# Safe paths like /dev/null, /dev/urandom, /dev/stdin, etc. are always
# accessible even in restricted mode.
#
# Workspace files (placed in ~/.rubot/workspace/):
#
# SOUL.md — The bot's personality and identity.
#   A freeform Markdown file describing who the bot is,
#   its values, communication style, and character.
#
# AGENTS.md — Agent configuration with YAML frontmatter + behavior rules.
#   Frontmatter can override: name, model, max_tokens, temperature,
#   max_tool_iterations, and tool enable/disable settings.
#   The body contains behavior rules injected into the system prompt.
#
# MEMORY.md — Persistent memory managed by the bot itself.
#   The bot reads this on every session and can update it via the
#   memory tool to remember facts, preferences, and context.
#
# Skills — specialized instruction sets loaded on demand.
#   Stored in: ~/.rubot/workspace/skills/{skill-name}/SKILL.md
#   Each skill has a SKILL.md with YAML frontmatter (name, description)
#   and markdown body (specialized instructions).
#   Skills appear in the system prompt as <available_skills> XML,
#   telling the bot when and how to use them.
#   Run "rubot init" to get the built-in "skill-creator" skill.
#
# Cron — scheduled jobs are stored in:
#   ~/.rubot/workspace/cron/jobs.json     (job definitions)
#   ~/.rubot/workspace/cron_pending/       (pending agent-turn messages)
#
# To disable the cron tool, set tools.cron.enabled: false above.
# Jobs are processed automatically on your next interaction with the bot.
#
# Run "rubot init" to create the workspace with default files.
