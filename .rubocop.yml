# frozen_string_literal: true

# RuboCop Rails Omakase, loaded straight from the rubocop-rails-omakase gem.
# https://github.com/rails/rubocop-rails-omakase
inherit_gem:
  rubocop-rails-omakase: rubocop.yml

inherit_mode:
  merge:
    - Exclude

AllCops:
  SuggestExtensions: false

# rubot is a pure-Ruby project (no Rails). The omakase Rails cops only exist to
# rewrite minitest assertions to their Rails spellings (assert_not over assert!,
# refute_x over assert_not_x), so they stay off here.
Rails:
  Enabled: false
Rails/AssertNot:
  Enabled: false
Rails/RefuteMethods:
  Enabled: false
